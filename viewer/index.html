<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>R6 Preview</title>
        <style>
            html, body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            body {
                background: #24282d;
                color: #ddd;
                font: 13px sans-serif;
            }
            
            canvas {
                display: block;
            }

            #status {
                position: absolute;
                left: 12px;
                bottom: 12px;
                pointer-events: none;
            }

            #toolbar {
                position: absolute;
                left: 12px;
                top: 12px;
                z-index: 1;
                display: flex;
                gap: 8px;
            }

            #toolbar button {
                background: #343e40;
                color: #ddd;
                border: 1px solid #555;
                padding: 6px 10px;
                cursor: pointer;
            }

            #toolbar button:disabled {
                opacity: 0.5;
                cursor: default;
            }
        </style>
        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/build/three.module.js",
                    "three/addons/": "./vendor/examples/jsm/"
                }
            }
        </script>
    </head>
    <body>
        <div id="toolbar">
            <button id="frame">Frame Model</button>
            <button id="reload" disabled>Reload Preview</button>
        </div>
        <div id="status">Loading preview...</div>
        <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
        <script type="module" src="./preview.js"></script>
    </body>
</html>
